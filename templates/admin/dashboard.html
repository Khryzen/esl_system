{{ define "content" }}
<div class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
  <div>
    <h2 class="text-2xl font-bold tracking-tight">
      Overview
    </h2>
    <p class="mt-1 text-sm text-gray-500">
      Here's today things.
    </p>
  </div>
</div>
<section class="min-h-100 grid gap-4 sm:grid-cols-3 xl:grid-cols-3">
  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
          Total Students
        </p>
  
        <h3 class="mt-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
          {{ .NumberOfStudents }}
        </h3>
      </div>
  
      <!-- Icon -->
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-200">
        <i data-lucide="graduation-cap" class="h-5 w-5"></i>
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
          Active Courses
        </p>
  
        <h3 class="mt-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
          {{ .NumberOfCourses }}
        </h3>
      </div>
  
      <!-- Icon -->
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-200">
        <i data-lucide="library" class="h-5 w-5"></i>
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-gray-900">
    <!-- Header -->
    <div class="flex items-start justify-between">
      <div>
        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">
          Active Packages
        </p>
  
        <h3 class="mt-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
          {{ .NumberOfPackages }}
        </h3>
      </div>
  
      <!-- Icon -->
      <div
        class="flex h-11 w-11 items-center justify-center rounded-xl bg-gray-100 text-gray-700 dark:bg-gray-800 dark:text-gray-200">
        <i data-lucide="square-library" class="h-5 w-5"></i>
      </div>
    </div>
  </div>
</section>
<hr class="mt-10">
{{ end }}
