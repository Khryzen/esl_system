<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <title>Login | ESL System</title>
  </head>

  <body class="min-h-screen bg-gray-100 text-gray-900 antialiased">
    <main class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-sm">
        <!-- Logo / Brand -->
        <div class="mb-8 text-center">
          <div
            class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-gray-900 text-white"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M3 9h18" />
              <path d="M9 21V9" />
            </svg>
          </div>
          <h1 class="text-2xl font-bold tracking-tight">Welcome Back</h1>
          <p class="mt-2 text-sm text-gray-500">
            Sign in to continue to your dashboard.
          </p>
        </div>

        <!-- Login Card -->
        <div
          class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8"
        >
          <form id="loginForm" class="space-y-5" action="/login/" method="POST">
            <!-- Username -->
            <div>
              <label for="username" class="mb-2 block text-sm font-medium">
                Username
              </label>

              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="Enter your username"
                required
                class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-2 focus:ring-gray-900/10"
              />
            </div>

            <!-- Password -->
            <div>
              <div class="mb-2 flex items-center justify-between">
                <label for="password" class="block text-sm font-medium">
                  Password
                </label>
              </div>

              <div class="relative">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  required
                  class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 pr-12 text-sm outline-none transition placeholder:text-gray-400 focus:border-gray-900 focus:ring-2 focus:ring-gray-900/10"
                />

                <!-- Show password -->
                <button
                  type="button"
                  id="togglePassword"
                  aria-label="Show password"
                  class="absolute right-3 top-1/2 -translate-y-1/2 rounded-lg p-1.5 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700"
                >
                  <svg
                    id="eyeIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
                    />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Error -->
            <div
              id="loginError"
              class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
            >
              Invalid username or password.
            </div>

            <!-- Login button -->
            <button
              id="loginButton"
              type="submit"
              class="flex w-full items-center justify-center rounded-xl bg-gray-900 px-4 py-3 text-sm font-semibold text-white transition hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
            >
              <span id="loginText"> Sign In </span>

              <svg
                id="loadingIcon"
                class="ml-2 hidden h-4 w-4 animate-spin"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>

                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                ></path>
              </svg>
            </button>
          </form>
        </div>

        <!-- Footer -->
        <p class="mt-6 text-center text-xs text-gray-400">
          © 2026 Dashboard. All rights reserved.
        </p>
      </div>
    </main>
  </body>
  <script src="/static/js/login.js"></script>
</html>
